# One port for everything: the web app at /, and the Supabase API under
# /auth/v1, /rest/v1, /storage/v1 and /functions/v1 (same paths as hosted
# Supabase, so the app talks to it unchanged).

# Path after /<service>/v1, still URL-encoded, with its query string.
map $request_uri $api_prefix {
  ~^(?<p>/[a-z]+/v1)/ $p;
  default "";
}
map $request_uri $api_uri {
  ~^/[a-z]+/v1(?<rest>/.*)$ $rest;
  default /;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  # Docker's DNS, re-resolved so the gateway starts even if a service is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Prefix $api_prefix;
  proxy_read_timeout 300s;

  location = /_health { access_log off; return 200 "ok\n"; }

  # Email template for Auth (fetched by the auth container).
  location /_templates/ { alias /usr/share/nginx/templates/; }

  location /auth/v1/ {
    set $up http://auth:9999;
    proxy_pass $up$api_uri;
  }

  location /rest/v1/ {
    set $up http://rest:3000;
    proxy_pass $up$api_uri;
  }

  location /storage/v1/ {
    set $up http://storage:5000;
    proxy_pass $up$api_uri;
  }

  location /functions/v1/ {
    set $up http://functions:9000;
    proxy_pass $up$api_uri;
  }

  # Web app (single-page: unknown paths load index.html).
  root /usr/share/nginx/html;
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /index.html;
  }

  # Static files are gzipped once at build time; API responses on the fly.
  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  open_file_cache max=200 inactive=60s;
}
